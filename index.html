.card>h2{font-size:14px;font-weight:700;color:var(--mut);letter-spacing:.2px}
.card>.row:first-child>h2{font-size:14px;font-weight:700;color:var(--mut)}

.xd[open]>.body{margin-top:0}

.top{margin-bottom:22px}
.card{padding:18px 18px 16px}

.rest{position:fixed;top:env(safe-area-inset-top,0px);inset-inline:0;max-width:540px;margin:0 auto;background:var(--acc);color:#fff;padding:12px 16px 14px;z-index:9;border-radius:0 0 18px 18px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.rest .mut{color:#fff;opacity:.85}.rest .rtv{font-size:34px;font-variant-numeric:tabular-nums;line-height:1.1}.rest button{background:rgba(255,255,255,.22);color:#fff}.rest .bar{background:rgba(255,255,255,.25);margin-top:10px}.rest .bar i{background:#fff}
.tst{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline:16px;max-width:508px;margin:0 auto;background:#f5b301;color:#2a1c00;border-radius:16px;padding:12px 16px;font-weight:700;z-index:10;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.ss .xd{background:transparent;border:0;border-radius:0;border-top:1px solid var(--line);padding:8px 6px;margin:0}.ss .xd:first-of-type{border-top:0}

.cal .c{min-height:72px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;font-size:12px;overflow:hidden;text-align:start;display:block;color:inherit;font-weight:400}.cal .c.e{background:transparent;border:0}.cal .c.td{outline:1.5px solid var(--acc)}.cal button.c{cursor:pointer}.cal .c.sel{background:var(--chip);border-color:var(--acc)}
.chp{display:block;background:#49e07a;color:#0d2a17;border-radius:6px;padding:1px 4px;font-size:11px;font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cal .mn{color:var(--acc);font-size:11px}

<body>
<div id="app"></div>
<script>
const E=(n,sets,rep,rest,tip='',ss=false,video='')=>({id:'e'+Math.random().toString(36).slice(2,8),n,sets,rep,rest,tip,ss,video});
const O=(d,k,p)=>({d,k,p});
const mkT=(name,user,pass)=>({id:user,name,user,pass,role:'t',status:'פעיל',water:750,goal:3000,progs:['g1'],plan:'p1',
 ms:[{v:1,c:0},{v:0,c:0},{v:0,c:0},{v:0,c:0}],hist:{},cur:{},last:null,
 weights:[['01.09',72.4],['08.09',72.0],['15.09',71.8],['22.09',71.9],['29.09',71.3]],checkin:null,
 coachNote:'שבוע טוב! נעלה משקל כשתעברי את הטווח העליון בכל הסטים.',block:{n:'היפרטרופיה',w:3,of:6},lastTrain:2});
let S={me:null,users:[],progs:[],plans:[]};
const TF=['water','ms','hist','cur','act','last','log','pr','chk','weights','checkin','lastDone','daily','day','reqs'],CF=['name','user','status','goal','block','coachNote','progs','plan'];
let sent={},offline=false,dirty=false,syncT=null,syncing=false,cred=null;
const pickF=(o,f)=>{const r={};f.forEach(k=>{if(o[k]!==undefined)r[k]=o[k]});return r};
const isoToday=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pendKey=u=>'dorfit_p_'+u.id;
async function api(m,u,b){let r;try{r=await fetch(u,{method:m,headers:{'Content-Type':'application/json','X-App':'1'},credentials:'same-origin',body:b?JSON.stringify(b):undefined})}catch(e){offline=true;throw e}
 offline=false;const j=await r.json().catch(()=>({}));
 if(r.status===401&&u!=='/api/login'){S.me=null;S.users=[];render();throw Object.assign(new Error('auth'),{status:401,auth:1})}
 if(!r.ok)throw Object.assign(new Error(j.error||'שגיאה'),{status:r.status});return j}
function save(){dirty=true;const u=me();try{if(u&&u.role==='t')localStorage.setItem(pendKey(u),JSON.stringify(pickF(u,TF)))}catch(e){}clearTimeout(syncT);syncT=setTimeout(sync,700)}
async function sync(){const u=me();if(!u)return;if(syncing){syncT=setTimeout(sync,700);return}syncing=true;
 try{if(u.role==='t'){const j=JSON.stringify(pickF(u,TF));if(j!==sent.me){await api('PUT','/api/me',JSON.parse(j));sent.me=j;try{if(JSON.stringify(pickF(u,TF))===j)localStorage.removeItem(pendKey(u))}catch(e){}}}
  else{const lib=JSON.stringify({progs:S.progs,plans:S.plans});if(lib!==sent.lib){await api('PUT','/api/library',JSON.parse(lib));sent.lib=lib}
   for(const t of S.users.filter(x=>x.role==='t')){const j=JSON.stringify(pickF(t,CF));if(j!==sent['u'+t.id]){await api('PUT','/api/users/'+t.id,JSON.parse(j));sent['u'+t.id]=j}}}
  dirty=false;if(offline){offline=false;render()}}
 catch(e){if(e.auth){}else if(e.status){dirty=false;flash('שגיאה בשמירה: '+e.message,3500);try{await reload()}catch(x){}}else{offline=true;render();syncT=setTimeout(sync,5000)}}
 finally{syncing=false}}
function rollDay(u){const t=isoToday();if(u.day===t)return;if(u.day){u.daily=u.daily||{};u.daily[u.day]={w:u.water||0,m:(u.ms||[]).filter(x=>x.v).length};const k=Object.keys(u.daily).sort();while(k.length>120)delete u.daily[k.shift()]}
 u.water=0;u.ms=(u.ms||[]).map(m=>({v:0,c:m.c||0}));u.checkin=null;u.day=t}
function applyState(st){S.me=st.me;S.users=st.users;S.progs=st.progs;S.plans=st.plans;sent={};const u=me();if(!u)return;
 if(u.role==='t'){sent.me=JSON.stringify(pickF(u,TF));try{const p=JSON.parse(localStorage.getItem(pendKey(u))||'null');if(p)Object.assign(u,p)}catch(e){}rollDay(u);if(JSON.stringify(pickF(u,TF))!==sent.me)save()}
 else{sent.lib=JSON.stringify({progs:S.progs,plans:S.plans});S.users.filter(x=>x.role==='t').forEach(t=>{sent['u'+t.id]=JSON.stringify(pickF(t,CF))})}}
async function reload(){applyState(await api('GET','/api/state'));render()}
function merge(st){const u=me();if(!u)return false;let ch=false;const D=(a,b)=>JSON.stringify(a)!==JSON.stringify(b);
 if(u.role==='t'){const su=st.users[0];if(!su)return false;if(D(u.plan,su.plan))u.ms=[];if(D(u.progs,su.progs))u.act=null;
  CF.forEach(k=>{if(D(u[k],su[k])){u[k]=su[k];ch=true}});if(D(S.progs,st.progs)){S.progs=st.progs;ch=true}if(D(S.plans,st.plans)){S.plans=st.plans;ch=true}
  if(JSON.stringify(pickF(u,TF))!==sent.me)save()}
 else st.users.forEach(su=>{const lu=S.users.find(x=>x.id===su.id);if(!lu){S.users.push(su);ch=true;return}TF.forEach(k=>{if(D(lu[k],su[k])){lu[k]=su[k];ch=true}})});
 return ch}
async function poll(){if(!S.me||document.hidden||syncing||dirty)return;try{const st=await api('GET','/api/state');if(merge(st)){const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()}}catch(e){}}
setInterval(poll,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
setInterval(()=>{const u=me();if(u&&u.role==='t'&&u.day&&u.day!==isoToday()){rollDay(u);save();render()}},60000);
async function boot(){try{if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});applyState(await api('GET','/api/state'));if(me()&&me().role==='c')ct='ov'}catch(e){}render()}
const lastTrain=u=>u.last?Math.floor((Date.now()-u.last.date)/864e5):(u.created?Math.floor((Date.now()-u.created)/864e5):0);
let tab='home',ct='tr',sel=null,pm=null,lm=null,rest=0,tick=null,err='',cp=0,cd=null,open=null,fin=false,dtab='sum',calM=null,calV='m',calSel=null,pe=0,pd=0,toast='';
const me=()=>S.users.find(u=>u.id===S.me),U=id=>S.users.find(x=>x.id===id);
const progOf=id=>S.progs.find(p=>p.id===id);

 <div class="row sp wr">${i>0?`<label class="c"><input type="checkbox" ${e.ss?'checked':''} onchange="ed('${b}.ss',this.checked);render()">סופרסט עם הקודם</label>`:'<span></span>'}<div class="row" style="gap:2px"><button class="g" aria-label="הזז למעלה" onclick="mv(${pe},${pd},${i},-1)">↑</button><button class="g" aria-label="הזז למטה" onclick="mv(${pe},${pd},${i},1)">↓</button><button class="g" onclick="dupEx(${pe},${pd},${i})">שכפל</button><button class="x" onclick="S.progs[${pe}].days[${pd}].ex.splice(${i},1);save();render()">מחק</button></div></div></div></details>`})}

 <div class="row sp"><button class="g" onclick="S.plans[${pi}].meals[${mi}].opts.push(O('',0,0));save();render()">+ אפשרות חלופית</button><button class="x" onclick="S.plans[${pi}].meals.splice(${mi},1);save();render()">מחק ארוחה</button></div></div></details>`}).join('')}

 <div class="nav">${[['sum','סקירה'],['wk','אימונים'],['nu','תזונה'],['log','היסטוריה'],['set','הגדרות']].map(([k,l])=>`<button class="${dtab===k?'on':''}" onclick="dtab='${k}';render()">${l}</button>`).join('')}</div>`;
 let b='';
 if(dtab==='sum')b=`${al.length?`<div class="row wr" style="margin-bottom:14px">${al.map(a=>`<span class="pill ${a[0]}">${a[1]}</span>`).join('')}</div>`:''}

 <div class="grid"><div class="card"><h2>${L?'אימון אחרון · '+L.name:'אימון אחרון'}</h2>${L&&L.rpe?`<div class="row wr" style="margin-bottom:10px"><span class="pill">נפח ${L.vol.toLocaleString()} ק״ג</span><span class="pill">${L.mins} דק׳</span><span class="pill ${L.rpe>=9?'warn':''}">קושי ${L.rpe}/10</span>${(L.prs||[]).map(p=>`<span class="pill ok">🏆 ${p.n} ${p.w}×${p.r}</span>`).join('')}</div>${L.note?`<div style="margin-bottom:10px">${L.note}</div>`:''}`:''}${notes(u).map(([id,t])=>`<div style="margin-bottom:8px"><span class="pill bad">הערה</span> ${exName(id)}: ${t}</div>`).join('')}${L?L.items.map(e=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><b>${e.n}</b><div class="mut">${e.sets.map(x=>x[0]+'×'+x[1]+(x[2]?' @'+x[2]:'')).join(' · ')}</div>${e.note?`<div><span class="pill bad">הערה</span> ${e.note}</div>`:''}</div>`).join(''):'<span class="mut">עדיין לא שמר אימון</span>'}</div>
 <div class="card"><h2>משקל גוף</h2>${chart(u.weights)}<div class="mut" style="margin-top:10px">${c?`צ׳ק-אין: שינה ${c.sleep||'—'} · אנרגיה ${c.energy||'—'} · מתח ${c.stress||'—'}`:'צ׳ק-אין לא מולא היום'}</div></div>
 <div class="card"><h2>הודעה למתאמן</h2><textarea id="cn" rows="3">${u.coachNote}</textarea><button class="p" style="margin-top:10px" onclick="saveNote('${u.id}')">שלח הודעה</button></div></div>`;
 if(dtab==='wk')b=dWk(u);
 if(dtab==='nu')b=dNu(u);
 if(dtab==='log')b=(u.log||[]).slice().sort((a,c)=>c.date-a.date).map(r=>`<div class="card"><div class="row sp wr"><b>${r.name}</b><span class="mut">${new Date(r.date).toLocaleDateString('he-IL')}</span></div><div class="row wr" style="margin:8px 0"><span class="pill">נפח ${r.vol.toLocaleString()} ק״ג</span><span class="pill">${r.mins} דק׳</span><span class="pill ${r.rpe>=9?'warn':''}">קושי ${r.rpe}/10</span></div>${r.note?`<div>${r.note}</div>`:''}${(r.items||[]).map(e=>`<div class="mut">${e.n}: ${e.sets.map(x=>x[0]+'×'+x[1]).join(' · ')}</div>`).join('')}</div>`).join('')||'<div class="card mut">עדיין אין אימונים שנשמרו.</div>';
 if(dtab==='set')b=`<div class="card" style="display:grid;gap:8px"><div class="mut">שם</div>${inp(`users.${ix}.name`,u.name,'שם')}<div class="mut">שם משתמש</div>${inp(`users.${ix}.user`,u.user,'שם משתמש')}<div class="mut">יעד מים (מ"ל)</div>${inp(`users.${ix}.goal`,u.goal,'3000','number')}<div class="mut">בלוק אימון</div><div class="ce">${inp(`users.${ix}.block.n`,u.block.n,'שם')}${inp(`users.${ix}.block.w`,u.block.w,'שבוע','number')}${inp(`users.${ix}.block.of`,u.block.of,'מתוך','number')}</div><div class="mut">סטטוס</div><select onchange="setSt('${u.id}',this.value)">${['פעיל','מושהה','ארכיון'].map(x=>`<option ${u.status===x?'selected':''}>${x}</option>`).join('')}</select><button class="g" onclick="resetPw('${u.id}')">איפוס סיסמה</button></div>`;
 return credBox()+head+b}

async function addUser(){const g=i=>document.getElementById(i).value.trim(),n=g('nn'),us=g('nu'),p=g('np');
 if(!n||!us||p.length<6){err='יש למלא שם, שם משתמש באנגלית וסיסמה (לפחות 6 תווים)';return render()}
 try{const r=await api('POST','/api/users',{name:n,user:us,pass:p});S.users.push(r.user);(r.plans||[]).forEach(x=>S.plans.push(x));sent['u'+r.user.id]=JSON.stringify(pickF(r.user,CF));sent.lib=JSON.stringify({progs:S.progs,plans:S.plans});err='';cred={user:r.user.user,pass:p};sel=r.user.id;dtab='wk';ct='tr';render()}catch(e){err=e.status===409?'שם המשתמש תפוס':e.message;render()}}

 if(!o)return flash('הזן את הסיסמה הנוכחית');if(c&&n!==c.value)return flash('אימות הסיסמה לא תואם');if(me().role==='c'&&n.length<8)return flash('סיסמה: לפחות 8 תווים');

const rmWarm=(did,eid)=>{const l=getLog(me(),did,{id:eid});l.sets=l.sets.filter(x=>!x.wu);save();render()};
function logCard(r){const wx=(me().weights||[]).find(w=>w[0]===dkey(r.date));
 return `<div class="card"><div class="row sp wr"><b>${r.name}</b><span class="mut">${new Date(r.date).toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})}</span></div><div class="row wr" style="margin:10px 0"><span class="pill">נפח ${r.vol.toLocaleString()} ק״ג</span><span class="pill">${r.mins} דק׳</span><span class="pill ${r.rpe>=9?'warn':''}">קושי ${r.rpe}/10</span>${(r.prs||[]).map(p=>`<span class="pill ok">🏆 ${p.n} ${p.w}×${p.r}</span>`).join('')}${wx?`<span class="pill">משקל ${wx[1]}</span>`:''}</div>${r.note?`<div style="margin-bottom:8px">${r.note}</div>`:''}${(r.items||[]).map(e=>`<div style="padding:6px 0;border-top:1px solid var(--line)"><b>${e.n}</b><div class="mut">${e.sets.map(x=>x[0]+'×'+x[1]).join(' · ')}</div>${e.note?`<div class="mut">הערה: ${e.note}</div>`:''}</div>`).join('')}</div>`}
function calendar(u){const now=new Date();if(!calM)calM={y:now.getFullYear(),m:now.getMonth()};
 const first=new Date(calM.y,calM.m,1),dim=new Date(calM.y,calM.m+1,0).getDate(),ev={},all=(u.log||[]).slice().sort((a,b)=>b.date-a.date);
 all.forEach(r=>{const d=new Date(r.date);if(d.getFullYear()===calM.y&&d.getMonth()===calM.m)(ev[d.getDate()]=ev[d.getDate()]||[]).push(r)});
 const mon=Object.values(ev).flat(),nm=r=>r.name.split('·').pop().trim(),isNow=d=>now.getFullYear()===calM.y&&now.getMonth()===calM.m&&now.getDate()===d,selOn=calSel&&calSel.y===calM.y&&calSel.m===calM.m;
 let cells='';for(let i=0;i<first.getDay();i++)cells+='<div class="c e"></div>';
 for(let d=1;d<=dim;d++){const e=ev[d]||[],inner=`<span class="mut">${d}</span>${e.slice(0,1).map(r=>`<span class="chp">${nm(r)}</span>`).join('')}${e.length>1?`<span class="mn">+${e.length-1}</span>`:''}`;
  cells+=e.length?`<button class="c ${isNow(d)?'td':''} ${selOn&&calSel.d===d?'sel':''}" onclick="calSel={y:${calM.y},m:${calM.m},d:${d}};render()" aria-label="אימון ב-${d}">${inner}</button>`:`<div class="c ${isNow(d)?'td':''}">${inner}</div>`}
 const vol=mon.reduce((a,r)=>a+r.vol,0),avg=mon.length?(mon.reduce((a,r)=>a+r.rpe,0)/mon.length).toFixed(1):'—';
 return `<div class="top"><h1 class="h1">יומן אימונים</h1><div class="seg"><button class="${calV==='m'?'on':''}" onclick="calV='m';render()">חודש</button><button class="${calV==='l'?'on':''}" onclick="calV='l';render()">רשימה</button></div></div>
 ${calV==='m'?`<div class="row sp" style="margin-bottom:12px"><button class="ic" aria-label="חודש קודם" onclick="calNav(-1)">›</button><b style="font-size:18px">${first.toLocaleDateString('he-IL',{month:'long',year:'numeric'})}</b><button class="ic" aria-label="חודש הבא" onclick="calNav(1)">‹</button></div>
 <div class="stats"><div><b>${mon.length}</b><span>אימונים החודש</span></div><div><b>${vol.toLocaleString()}</b><span>נפח כולל (ק״ג)</span></div><div><b>${avg}</b><span>קושי ממוצע</span></div></div>
 <div class="cal">${['א','ב','ג','ד','ה','ו','ש'].map(x=>`<div class="wh">${x}</div>`).join('')}${cells}</div>
 <h2 class="sec">${selOn?'פירוט היום שנבחר':'לחץ על יום מסומן כדי לראות את האימון'}</h2>${selOn?(ev[calSel.d]||[]).map(logCard).join(''):''}`
 :`${all.map(logCard).join('')||'<div class="card mut">עדיין אין אימונים שנשמרו. אחרי האימון הראשון הם יופיעו כאן.</div>'}`}`}
function calNav(n){const d=new Date(calM.y,calM.m+n,1);calM={y:d.getFullYear(),m:d.getMonth()};calSel=null;render()}

const OP=new Set(),tgo=(k,o)=>{o?OP.add(k):OP.delete(k)};
function render(){const a=document.getElementById('app'),u=me(),f=document.activeElement&&document.activeElement.id;
 a.innerHTML=!u?login():u.role==='c'?coach():trainee(u);if(offline&&u)a.insertAdjacentHTML('beforeend','<div class="off" role="status">אין חיבור לשרת. השינויים נשמרים במכשיר ויישלחו כשהחיבור יחזור</div>');if(f){const e=document.getElementById(f);if(e)e.focus()}}
boot();
</script>
</body>
</html>
