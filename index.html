  if(okR.includes('steps')){const R=await H.queryAggregated({dataType:'steps',startDate:st.toISOString(),endDate:now.toISOString(),bucket:'day',aggregation:'sum'});
   (R.samples||[]).forEach(x=>{const d=isoOf(new Date(x.startDate)),v=Math.round(x.value||0);if(!(v>0))return;if(d===isoToday()){out.steps=v;if(v>(u.steps||0)){const p=u.steps||0;u.steps=Math.min(v,200000);stepsCheck(p,u)}}else{const o=u.daily[d]=u.daily[d]||{};if(v>(o.s||0))o.s=v}})}
