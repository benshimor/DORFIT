async function rcCanvas(r){const W=1080,P=64,pal=rcPal(r.cat),FF='system-ui,-apple-system,"Segoe UI",Arial,sans-serif',F=(w,s)=>w+' '+s+'px '+FF;

 const sc=document.createElement('canvas');sc.width=W;sc.height=10;
 const rr=(x,a,b,w,h,rad)=>{x.beginPath();x.moveTo(a+rad,b);x.arcTo(a+w,b,a+w,b+h,rad);x.arcTo(a+w,b+h,a,b+h,rad);x.arcTo(a,b+h,a,b,rad);x.arcTo(a,b,a+w,b,rad);x.closePath()};
 const paint=(x,draw)=>{x.direction='rtl';x.textAlign='right';x.textBaseline='alphabetic';let y=0;const R=W-P;
  const wrap=(t,font,mw)=>{x.font=font;const out=[];String(t).split('\n').forEach(par=>{let line='';par.split(/\s+/).filter(Boolean).forEach(w=>{const tst=line?line+' '+w:w;if(x.measureText(tst).width>mw&&line){out.push(line);line=w}else line=tst});out.push(line)});return out};
  const HH=img?520:400;
  if(draw){const g=x.createLinearGradient(0,0,W,HH);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);x.fillStyle=g;x.fillRect(0,0,W,HH);
   if(img){const s=Math.max(W/img.width,HH/img.height),w=img.width*s,h=img.height*s;x.drawImage(img,(W-w)/2,(HH-h)/2,w,h)}else{x.font=F('400',220);x.textAlign='center';x.fillStyle='#fff';x.fillText(r.em||'🍽',W/2,HH/2+80);x.textAlign='right'}
   x.fillStyle='rgba(255,255,255,.92)';x.font=F('700',32);const cw=x.measureText(r.cat).width+56;rr(x,R-cw,48,cw,64,32);x.fill();x.fillStyle=pal[0];x.fillText(r.cat,R-28,92);
   x.fillStyle='#fffaf3';rr(x,0,HH-56,W,200,56);x.fill()}
  y=HH+34;
  const tl=wrap(r.n,F('800',68),W-2*P);tl.forEach(l=>{y+=84;if(draw){x.fillStyle='#1b1e27';x.font=F('800',68);x.fillText(l,R,y)}});y+=10;
  if(r.d){wrap(r.d,F('500',34),W-2*P).forEach(l=>{y+=48;if(draw){x.fillStyle='#5b6170';x.font=F('500',34);x.fillText(l,R,y)}});y+=6}
  const meta=[r.tm?r.tm+' דקות':'',r.sv?r.sv+(r.sv===1?' מנה':' מנות'):''].filter(Boolean).join('  ·  ');if(meta){y+=50;if(draw){x.fillStyle=pal[0];x.font=F('700',32);x.fillText(meta,R,y)}}
  y+=28;
  if(r.k>0){const gap=18,tw=(W-2*P-3*gap)/4,tiles=[[Math.round(r.k),'קלוריות'],[Math.round(r.p)+' ג׳','חלבון'],[Math.round(r.c)+' ג׳','פחמימה'],[Math.round(r.f)+' ג׳','שומן']];
   if(draw)tiles.forEach((t,i)=>{const a=R-(i+1)*tw-i*gap;x.fillStyle='#fff';rr(x,a,y,tw,150,26);x.fill();x.strokeStyle='#efe6d8';x.lineWidth=2;x.stroke();x.textAlign='center';x.fillStyle='#1b1e27';x.font=F('800',54);x.fillText(String(t[0]),a+tw/2,y+76);x.fillStyle='#7a8090';x.font=F('600',28);x.fillText(t[1],a+tw/2,y+122);x.textAlign='right'});
   y+=150+14;y+=44;if(draw){x.fillStyle='#9aa0ae';x.font=F('500',24);x.fillText('ערכים משוערים, לכל מנה',R,y-12)}}
  const head=t=>{y+=30;if(draw){x.fillStyle=pal[0];rr(x,R-10,y,10,52,5);x.fill();x.fillStyle='#1b1e27';x.font=F('800',46);x.fillText(t,R-30,y+42)}y+=52+16};
  if(r.ing.length){head('מצרכים');r.ing.forEach(t=>{const L=wrap(t,F('500',36),W-2*P-50);L.forEach((l,i)=>{y+=52;if(draw){if(!i){x.fillStyle=pal[1];x.beginPath();x.arc(R-10,y-13,8,0,7);x.fill()}x.fillStyle='#2a2e3a';x.font=F('500',36);x.fillText(l,R-40,y)}});y+=8})}
  if(r.st.length){y+=14;head('הכנה');r.st.forEach((t,n)=>{const L=wrap(t,F('500',36),W-2*P-84);if(draw){const gr=x.createLinearGradient(R-56,y,R,y+56);gr.addColorStop(0,pal[0]);gr.addColorStop(1,pal[1]);x.fillStyle=gr;x.beginPath();x.arc(R-28,y+30,28,0,7);x.fill();x.fillStyle='#fff';x.font=F('800',32);x.textAlign='center';x.fillText(String(n+1),R-28,y+42);x.textAlign='right'}
   L.forEach((l,i)=>{if(draw){x.fillStyle='#2a2e3a';x.font=F('500',36);x.fillText(l,R-84,y+40+i*50)}});y+=Math.max(60,L.length*50+10)+16})}
  if(r.tip){y+=18;const L=wrap(r.tip,F('500',34),W-2*P-60),h=L.length*48+96;if(draw){x.fillStyle='#fff3d6';rr(x,P,y,W-2*P,h,30);x.fill();x.fillStyle='#b26a00';x.font=F('800',34);x.fillText('טיפ',R-30,y+54);x.fillStyle='#4a3a12';x.font=F('500',34);L.forEach((l,i)=>x.fillText(l,R-30,y+104+i*48))}y+=h}
  y+=40;if(draw){x.fillStyle='#e7dccb';x.fillRect(P,y,W-2*P,2);x.textAlign='center';x.fillStyle=pal[0];x.font=F('800',44);x.fillText('DOR FIT',W/2,y+66);x.fillStyle='#9aa0ae';x.font=F('500',26);x.fillText('אימון ותזונה מותאמים אישית',W/2,y+104);x.textAlign='right'}
  y+=130;return y};
 const H=paint(sc.getContext('2d'),false),cv=document.createElement('canvas');cv.width=W;cv.height=Math.ceil(H);const x=cv.getContext('2d');x.fillStyle='#fffaf3';x.fillRect(0,0,W,H);paint(x,true);return cv}
